  termux:
    name: Termux (Bionic container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and test with Termux perl
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src termux/termux-docker:x86_64 bash -lc '
            set -e
            pkg update -y
            pkg install -y perl clang make curl
            mkdir -p "$HOME/parataxis"
            cp -a /src/. "$HOME/parataxis/"
            cd "$HOME/parataxis"
            perl -V:version -V:archname -V:useshrplib -V:ldflags
            curl -fsSL https://cpanmin.us -o /tmp/cpanmin.pl
            perl /tmp/cpanmin.pl --notest App::cpanminus Module::Build::Tiny
            export PATH="$(dirname "$(command -v perl)"):$(perl -MConfig -e "print join q(:), @Config{qw(sitebin scriptdir)}"):$PATH"
            command -v cpanm
            cpanm --installdeps --notest -v .
            cpanm --notest -v IO::Async::Loop Mojo::IOLoop || echo "::warning::event-loop drivers unavailable"
            perl Build.PL
            ./Build
            ./Build test --v
          '
